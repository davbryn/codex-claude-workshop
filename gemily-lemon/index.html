<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1c0a3d">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Gemily Lemon's Last Stand</title>
<style>
:root{
  --bg0:#2b0f55; --bg1:#0c1a4d; --accent:#c46bd0;
  --ink:#2a0f3a; --paper:#fffdf5; --pink:#ff3d8b; --yellow:#ffe35a; --mint:#3ee6ac; --blue:#4db8ff;
  --font:"Arial Rounded MT Bold","Trebuchet MS","Segoe UI",Verdana,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --paper:#fffdf5; } }
:root[data-theme="dark"]{ --paper:#fffdf5; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#12082b;color:#fff;font-family:var(--font);overflow:hidden;overscroll-behavior:none}
[hidden]{display:none!important}
button{font-family:inherit;border:0;color:inherit;cursor:pointer;touch-action:manipulation}
#app{position:relative;width:100%;max-width:560px;height:100vh;height:100dvh;margin:0 auto;overflow:hidden;background:linear-gradient(160deg,var(--bg0),var(--bg1));transition:background .6s}
#bgfx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(6px);opacity:.28;animation:drift 14s ease-in-out infinite alternate}
.blob:nth-child(1){width:300px;height:300px;left:-80px;top:8%;background:#ff3d8b}
.blob:nth-child(2){width:260px;height:260px;right:-70px;top:38%;background:#4db8ff;animation-duration:18s}
.blob:nth-child(3){width:340px;height:340px;left:10%;bottom:-120px;background:#ffe35a;opacity:.18;animation-duration:22s}
.blob:nth-child(4){width:160px;height:160px;right:12%;top:-40px;background:#3ee6ac;animation-duration:12s}
@keyframes drift{to{transform:translate(40px,-60px) scale(1.15)}}

/* ---------- HUD */
#top{position:absolute;z-index:6;top:0;left:0;right:0;height:58px;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 12px 0;height:calc(58px + env(safe-area-inset-top))}
.ic{width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.35);font-size:18px;display:grid;place-items:center;backdrop-filter:blur(4px);transition:transform .1s}
.ic:active{transform:scale(.9)}
.topc{flex:1;text-align:center;line-height:1.05}
#lvlName{font-size:20px;letter-spacing:.06em;text-shadow:0 2px 0 var(--ink),0 0 12px rgba(255,255,255,.35)}
#worldName{font-size:12px;opacity:.8;letter-spacing:.04em}
#scoreBox{min-width:92px;text-align:right;line-height:1}
#score{font-size:22px;color:var(--yellow);text-shadow:0 2px 0 var(--ink)}
#scoreBox small{display:block;font-size:9px;letter-spacing:.2em;opacity:.7;margin-top:2px}
#subbar{position:absolute;z-index:6;left:0;right:0;top:calc(58px + env(safe-area-inset-top));height:38px;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 12px}
.pill{background:rgba(0,0,0,.28);border:2px solid rgba(255,255,255,.22);border-radius:99px;padding:4px 12px;font-size:14px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.pill b{color:var(--yellow);font-size:16px}
#starsBox{display:flex;gap:2px;font-size:26px;line-height:1}
#starsBox i{font-style:normal;color:rgba(255,255,255,.2);text-shadow:0 2px 0 rgba(0,0,0,.4);transition:all .25s}
#starsBox i.on{color:var(--yellow);text-shadow:0 2px 0 #b8741a,0 0 12px rgba(255,227,90,.8)}
#stage{position:absolute;z-index:2;touch-action:none;border-radius:20px;box-shadow:0 14px 40px rgba(0,0,0,.55),0 0 0 3px rgba(255,255,255,.1)}
#stage canvas{display:block;width:100%;height:100%;border-radius:20px}
#stage.zesting{cursor:crosshair;box-shadow:0 0 0 4px var(--pink),0 0 40px rgba(255,61,139,.7)}
#combo{position:absolute;left:50%;top:7%;transform:translate(-50%,0) scale(.4);font-size:54px;color:var(--yellow);text-shadow:0 4px 0 var(--ink),0 0 24px rgba(255,200,0,.8);-webkit-text-stroke:2px var(--ink);opacity:0;pointer-events:none;transition:all .15s}
#combo.on{opacity:1;transform:translate(-50%,0) scale(1);animation:cpulse .4s infinite alternate}
@keyframes cpulse{to{transform:translate(-50%,0) scale(1.18) rotate(-3deg)}}

/* ---------- bottom: Gemily + bubble + powerups */
#bottom{position:absolute;z-index:6;left:0;right:0;bottom:0;height:clamp(150px,22vh,215px);display:flex;align-items:flex-end;padding:0 10px calc(env(safe-area-inset-bottom) + 8px) 0;pointer-events:none}
#bottom>*{pointer-events:auto}
#gemBox{flex:0 0 auto;width:clamp(120px,36vw,190px);align-self:flex-end;margin-left:-4px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.4))}
#bubbleCol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;min-width:0;height:100%;padding-bottom:6px}
#bubble{position:relative;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:18px;padding:9px 12px;font-size:14px;line-height:1.25;font-weight:800;min-height:56px;display:flex;align-items:center;box-shadow:0 5px 0 rgba(0,0,0,.35);opacity:0;transform:translateY(10px) scale(.96);transform-origin:0 100%;transition:all .22s cubic-bezier(.3,1.6,.5,1);margin-bottom:2px}
#bubble.show{opacity:1;transform:none}
#bubble::before{content:"";position:absolute;left:-14px;bottom:16px;border:9px solid transparent;border-right:14px solid var(--ink);border-left:0}
#bubble::after{content:"";position:absolute;left:-9px;bottom:18px;border:7px solid transparent;border-right:11px solid var(--paper);border-left:0}
#bubble.show:empty{opacity:0}
#power{display:flex;gap:10px;align-items:center;justify-content:flex-end}
.pw{position:relative;width:56px;height:56px;border-radius:18px;font-size:26px;display:grid;place-items:center;background:linear-gradient(#ffe35a,#ffb21f);box-shadow:0 5px 0 #a8590c,0 8px 14px rgba(0,0,0,.35);border:3px solid var(--ink);transition:transform .1s,filter .2s}
.pw:active{transform:translateY(4px);box-shadow:0 1px 0 #a8590c}
.pw:disabled{filter:grayscale(.9) brightness(.7);opacity:.7}
.pw i{position:absolute;right:-6px;top:-8px;min-width:24px;height:24px;border-radius:12px;background:var(--pink);color:#fff;font-size:13px;font-style:normal;display:grid;place-items:center;border:2px solid var(--ink)}
#btnZest{background:linear-gradient(#ff7ab8,#ff3d8b);box-shadow:0 5px 0 #8c1048,0 8px 14px rgba(0,0,0,.35)}
#btnZest.active{animation:pulse .5s infinite alternate}
#btnMega{height:56px;padding:0 14px;border-radius:18px;font-size:15px;letter-spacing:.04em;background:linear-gradient(#b46bff,#ff3d8b);border:3px solid var(--ink);box-shadow:0 5px 0 #4b1086,0 0 24px rgba(255,61,139,.8);animation:pulse .6s infinite alternate;color:#fff;text-shadow:0 2px 0 var(--ink)}
@keyframes pulse{to{transform:scale(1.08)}}

/* ---------- screens */
.screen{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;opacity:0;transition:opacity .35s;pointer-events:none}
.screen.open{opacity:1;pointer-events:auto}
.btn{position:relative;font-size:20px;letter-spacing:.06em;padding:14px 26px;border-radius:20px;background:linear-gradient(#5ef2b9,#1fc489);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);border:3px solid var(--ink);box-shadow:0 6px 0 #0d7752,0 12px 20px rgba(0,0,0,.35);transition:transform .08s}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #0d7752}
.btn.big{font-size:30px;padding:18px 34px;background:linear-gradient(#ffe35a,#ffa21f);box-shadow:0 8px 0 #a8590c,0 14px 24px rgba(0,0,0,.4);animation:bob 1.4s ease-in-out infinite;color:var(--ink);text-shadow:0 2px 0 rgba(255,255,255,.55)}
.btn.big:active{box-shadow:0 2px 0 #a8590c}
.btn.pink{background:linear-gradient(#ff7ab8,#ff3d8b);box-shadow:0 6px 0 #8c1048,0 12px 20px rgba(0,0,0,.35)}
.btn.blue{background:linear-gradient(#7fd2ff,#2f8fe0);box-shadow:0 6px 0 #144f8c,0 12px 20px rgba(0,0,0,.35)}
.btn.small{font-size:15px;padding:10px 16px;border-radius:16px}
@keyframes bob{50%{transform:translateY(-6px) scale(1.03)}}

#sTitle{background:radial-gradient(120% 60% at 50% 38%,transparent 30%,rgba(10,2,30,.55) 100%),linear-gradient(180deg,rgba(14,3,40,.7),transparent 30%,transparent 55%,rgba(14,3,40,.85))}
.logo{margin-top:calc(env(safe-area-inset-top) + 26px);text-align:center;line-height:.9;transform:rotate(-3deg);animation:logo 3s ease-in-out infinite;filter:drop-shadow(0 10px 0 rgba(0,0,0,.25))}
@keyframes logo{50%{transform:rotate(-1deg) scale(1.03)}}
.logo span{display:block;font-weight:900;-webkit-text-stroke:7px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink)}
.logo .l1{font-size:min(19vw,104px);color:#ffd21f;-webkit-text-stroke:10px var(--ink);letter-spacing:.02em}
.logo .l2{font-size:min(10vw,54px);color:#fff;margin-top:2px;-webkit-text-stroke:6px var(--ink)}
.logo .l3{font-size:min(11.6vw,64px);color:var(--pink);-webkit-text-stroke:7px var(--ink)}
#titleGem{position:absolute;left:-8%;bottom:0;width:min(54%,280px);filter:drop-shadow(0 10px 18px rgba(0,0,0,.5))}
.menu{position:absolute;right:16px;bottom:calc(env(safe-area-inset-bottom) + 28px);display:flex;flex-direction:column;gap:14px;align-items:stretch;width:min(52%,260px)}
.tag{text-align:center;font-size:13px;opacity:.9;margin:2px 0 0;text-shadow:0 2px 0 var(--ink)}

#sLevels,#sPause,#sClear,#sStory{background:rgba(10,3,30,.82);backdrop-filter:blur(6px)}
.panel{margin:auto;width:min(92%,440px);background:linear-gradient(#4a2290,#2a1160);border:4px solid var(--ink);border-radius:28px;box-shadow:0 10px 0 rgba(0,0,0,.4),0 0 0 3px rgba(255,255,255,.16) inset,0 30px 60px rgba(0,0,0,.5);padding:20px 18px;text-align:center}
.panel h2{margin:0 0 4px;font-size:30px;letter-spacing:.05em;color:var(--yellow);text-shadow:0 3px 0 var(--ink);-webkit-text-stroke:1px var(--ink)}
.panel p{margin:4px 0 12px;opacity:.9}
.panel .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px}
#sLevels .panel{height:min(88%,720px);display:flex;flex-direction:column;padding-bottom:14px}
#lvGrid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:6px 4px 10px;margin-top:8px;-webkit-overflow-scrolling:touch}
.lvWorld{grid-column:1/-1;text-align:left;font-size:13px;letter-spacing:.06em;color:var(--mint);margin-top:8px;text-shadow:0 2px 0 var(--ink)}
.lvBtn{aspect-ratio:1;border-radius:18px;background:linear-gradient(#ffe35a,#ffa21f);border:3px solid var(--ink);box-shadow:0 5px 0 #a8590c;font-size:26px;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;transition:transform .08s}
.lvBtn:active{transform:translateY(4px);box-shadow:0 1px 0 #a8590c}
.lvBtn small{font-size:11px;color:#c2570a;letter-spacing:1px;min-height:13px}
.lvBtn small i{font-style:normal;color:rgba(0,0,0,.2)}
.lvBtn.boss{background:linear-gradient(#ff9ad0,#ff3d8b);box-shadow:0 5px 0 #8c1048}
.lvBtn.locked{background:#4a3a78;box-shadow:0 5px 0 #2a1d50;color:rgba(255,255,255,.4)}

#clStars{display:flex;justify-content:center;gap:6px;margin:6px 0 4px}
#clStars i{font-style:normal;font-size:74px;line-height:1;color:rgba(255,255,255,.18);text-shadow:0 5px 0 rgba(0,0,0,.4);transform:scale(.6)}
#clStars i:nth-child(2){margin-top:-14px}
#clStars i.on{color:var(--yellow);text-shadow:0 5px 0 #b8741a,0 0 28px rgba(255,227,90,.9);animation:starpop .6s cubic-bezier(.3,1.8,.5,1) forwards}
@keyframes starpop{0%{transform:scale(.2) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
#clScore{font-size:46px;color:var(--mint);text-shadow:0 4px 0 var(--ink);-webkit-text-stroke:1.5px var(--ink)}
.sub{font-size:14px;opacity:.85}
#clearGem{position:absolute;left:-4%;bottom:0;width:min(46%,230px);pointer-events:none;filter:drop-shadow(0 8px 14px rgba(0,0,0,.5))}
#clBubble{position:absolute;right:14px;bottom:calc(env(safe-area-inset-bottom) + 46px);width:min(56%,270px)}
#clBubble #bubble{font-size:16px;min-height:64px}
#sClear .panel{margin-top:12%;position:relative}
#sClear .panel{margin-bottom:auto}

#sStory .story{margin:auto auto 0;width:100%;position:relative;height:100%;display:flex;flex-direction:column}
#storyBubble{margin:auto 18px 0 auto;width:min(86%,430px);padding:0 0 12px}
#storyBubble #bubble{font-size:19px;padding:16px 18px;min-height:130px;transform-origin:20% 100%;opacity:1;transform:none}
#storyBubble #bubble::before,#storyBubble #bubble::after{left:34px;bottom:-24px;border:12px solid transparent;border-top:18px solid var(--ink);border-bottom:0;border-right:12px solid transparent}
#storyBubble #bubble::after{left:36px;bottom:-17px;border-top:15px solid var(--paper);border-width:10px 10px 0 10px;border-color:var(--paper) transparent transparent transparent}
#storyN{font-size:12px;opacity:.7;margin-bottom:6px;letter-spacing:.2em}
#storyGem{width:min(62%,320px);margin-left:-4%;filter:drop-shadow(0 10px 18px rgba(0,0,0,.5))}
#storyBtns{position:absolute;right:18px;bottom:calc(env(safe-area-inset-bottom) + 24px);display:flex;flex-direction:column;gap:10px;align-items:flex-end}
#storyBtn{opacity:.45}
#storyBtn.ready{opacity:1;animation:bob 1s infinite}
#storySkip{background:none;font-size:14px;opacity:.7;text-decoration:underline;padding:6px}

#sSlot{position:absolute;inset:0;z-index:30;display:flex;background:rgba(10,3,30,.72);backdrop-filter:blur(4px);opacity:0;transition:opacity .25s;pointer-events:none}
#sSlot.open{opacity:1;pointer-events:auto}
.slot{margin:auto;width:min(90%,420px);padding:18px;border-radius:30px;background:linear-gradient(#ff5fa8,#b4207a);border:5px solid var(--ink);box-shadow:0 10px 0 #5a0f3f,0 0 60px rgba(255,61,139,.7);text-align:center;transform:scale(.7);transition:transform .4s cubic-bezier(.3,1.7,.5,1)}
#sSlot.open .slot{transform:scale(1)}
.slot h3{margin:0 0 10px;font-size:22px;letter-spacing:.08em;color:var(--yellow);text-shadow:0 3px 0 var(--ink)}
.reels{display:flex;gap:8px;justify-content:center;background:#1a0a30;border-radius:20px;padding:10px;border:4px solid var(--ink);box-shadow:inset 0 0 20px #000}
.reel{flex:1;aspect-ratio:.9;background:linear-gradient(#fff,#e9e2ff 45%,#fff);border-radius:14px;display:grid;place-items:center;font-size:clamp(44px,15vw,72px);overflow:hidden;border:3px solid var(--ink)}
.reel.spin span{animation:reelshake .12s infinite}
.reel.hit{background:linear-gradient(#fff6a8,#ffd21f);animation:starpop .5s}
@keyframes reelshake{50%{transform:translateY(8px) scale(.94);filter:blur(1.4px)}}
#slotMsg{margin-top:12px;font-size:24px;min-height:34px;color:#fff;text-shadow:0 3px 0 var(--ink)}
#slotMsg.win{color:var(--yellow);animation:pulse .4s infinite alternate}

/* ---------- Gemily SVG */
.gem-wrap{position:relative}
.gem{width:100%;height:auto;display:block;overflow:visible}
.mouth{display:none}
.gem[data-mood="idle"] .m-idle,.gem:not([data-mood="talk"]):not([data-mood="happy"]):not([data-mood="shock"]):not([data-mood="smug"]) .m-idle{display:inline}
.gem[data-mood="talk"] .m-talk{display:inline}
.gem[data-mood="happy"] .m-happy{display:inline}
.gem[data-mood="shock"] .m-shock{display:inline}
.gem[data-mood="smug"] .m-smug{display:inline}
.m-talk .talkmouth{transform-box:fill-box;transform-origin:center;animation:talk .2s infinite alternate}
@keyframes talk{from{transform:scaleY(.35)}to{transform:scaleY(1.15)}}
.gem-eye{transform-box:fill-box;transform-origin:50% 50%;animation:gblink 4.3s infinite}
@keyframes gblink{0%,93%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.08)}}
.gem .iris,.gem .pupil{animation:glook 7s infinite}
@keyframes glook{0%,35%{transform:translate(0,0)}42%,70%{transform:translate(-3px,1px)}78%,92%{transform:translate(3px,-1px)}100%{transform:translate(0,0)}}
.gem-head,.gem-hand{transform-origin:122px 176px;animation:gsway 5.5s ease-in-out infinite}
@keyframes gsway{0%,100%{transform:rotate(-1.6deg) translateY(0)}50%{transform:rotate(1.8deg) translateY(-2px)}}
.gem-body{animation:gbob 3.2s ease-in-out infinite;transform-origin:122px 300px}
@keyframes gbob{50%{transform:scaleY(1.012)}}
.gem[data-mood="happy"] .brow-l,.gem[data-mood="happy"] .brow-r,.gem[data-mood="shock"] .brow-l,.gem[data-mood="shock"] .brow-r{transform:translateY(-5px)}
.gem[data-mood="smug"] .brow-l{transform:translateY(-3px) rotate(-4deg);transform-box:fill-box}
.gem-spark{opacity:0}
.cheer .gem{animation:cheer .45s ease-in-out infinite alternate}
.cheer .gem-spark{opacity:1;animation:twinkle .5s infinite alternate}
@keyframes cheer{from{transform:translateY(0) rotate(-1.5deg)}to{transform:translateY(-8px) rotate(1.5deg)}}
@keyframes twinkle{from{transform:scale(.7);opacity:.5}to{transform:scale(1.15);opacity:1}}
.gem-spark path{transform-box:fill-box;transform-origin:center}

body[data-phase="title"] #top,body[data-phase="title"] #subbar,body[data-phase="title"] #bottom,body[data-phase="boot"] #top,body[data-phase="boot"] #subbar,body[data-phase="boot"] #bottom{visibility:hidden}
@media (max-height:640px){ #bubble{font-size:12.5px;min-height:46px} .pw{width:48px;height:48px;font-size:22px} }
@media (prefers-reduced-motion: reduce){ .blob,.logo,.btn.big{animation:none} }
</style>
</head>
<body data-phase="boot">
<div id="app">
  <div id="bgfx"><div class="blob"></div><div class="blob"></div><div class="blob"></div><div class="blob"></div></div>

  <header id="top">
    <button id="btnPause" class="ic" aria-label="Pause">❚❚</button>
    <div class="topc"><div id="lvlName">LEVEL 1</div><div id="worldName">The Lounge</div></div>
    <div id="scoreBox"><span id="score">0</span><small>SCORE</small></div>
    <button id="btnSnd" class="ic" aria-label="Sound">🔊</button>
  </header>
  <div id="subbar">
    <div class="pill">🍎 <b id="nFruit">0</b></div>
    <div id="starsBox"><i>★</i><i>★</i><i>★</i></div>
    <div class="pill">SHOTS <b id="nShots">0</b>/<b id="nPar">0</b></div>
  </div>

  <div id="stage"><canvas id="gl"></canvas><div id="combo"></div></div>

  <footer id="bottom">
    <div id="gemBox"></div>
    <div id="bubbleCol">
      <div id="bubble"><span id="bubbleText"></span></div>
      <div id="power">
        <button id="btnMega" class="pw" hidden>✨ MEGA SQUEEZE</button>
        <button id="btnHint" class="pw" aria-label="Hint">💡<i id="hintN">3</i></button>
        <button id="btnZest" class="pw" aria-label="Zest bomb">💣<i id="zestN">1</i></button>
      </div>
    </div>
  </footer>

  <section id="sTitle" class="screen" hidden>
    <div class="logo"><span class="l1">GEMILY</span><span class="l2">LEMON'S</span><span class="l3">LAST STAND</span></div>
    <div id="titleGem"></div>
    <div class="menu">
      <button id="btnContinue" class="btn big">PLAY</button>
      <button id="btnLevels" class="btn blue">LEVELS</button>
      <p class="tag">Pull back. Let go.<br>Pop the Fruit Mafia.</p>
    </div>
  </section>

  <section id="sStory" class="screen" hidden>
    <div class="story">
      <div id="storyBubble"><div id="storyN"></div></div>
      <div id="storyGem"><div id="storyGemSlot"></div></div>
    </div>
    <div id="storyBtns"><button id="storyBtn" class="btn pink">NEXT ▸</button><button id="storySkip">skip intro</button></div>
  </section>

  <section id="sLevels" class="screen" hidden>
    <div class="panel"><h2>CHOOSE LEVEL</h2><div class="sub">Four worlds. Endless levels. One lemon.</div><div id="lvGrid"></div><div class="row"><button id="lvBack" class="btn small pink">◂ BACK</button></div></div>
  </section>

  <section id="sPause" class="screen" hidden>
    <div class="panel"><h2>PAUSED</h2><p>Gemily is on a coffee break.</p>
      <div class="row" style="flex-direction:column;align-items:stretch">
        <button id="btnResume" class="btn">RESUME</button>
        <button id="btnRestart" class="btn blue">RESTART LEVEL</button>
        <button id="btnPLevels" class="btn blue">LEVELS</button>
        <button id="tgMusic" class="btn small pink">Music: ON</button>
        <button id="tgSfx" class="btn small pink">Sound FX: ON</button>
        <button id="btnPHome" class="btn small">HOME</button>
      </div></div>
  </section>

  <section id="sClear" class="screen" hidden>
    <div class="panel">
      <h2 id="clTitle">TABLE CLEARED!</h2>
      <div class="sub" id="clLevel"></div>
      <div id="clStars"><i>★</i><i>★</i><i>★</i></div>
      <div id="clScore">+0</div>
      <div class="sub" id="clShots"></div>
      <div class="sub" id="clBest" style="color:var(--mint);margin-top:2px"></div>
      <div class="row"><button id="clNext" class="btn big" style="animation:none;font-size:24px">NEXT LEVEL ▸</button></div>
      <div class="row"><button id="clReplay" class="btn small blue">REPLAY</button><button id="clMenu" class="btn small pink">LEVELS</button></div>
    </div>
    <div id="clearGem"></div><div id="clBubble"></div>
  </section>

  <section id="sSlot" hidden>
    <div class="slot"><h3 id="slotTitle">LUCKY JUICE SLOTS</h3>
      <div class="reels"><div class="reel" id="reel0"><span>🍋</span></div><div class="reel" id="reel1"><span>🍋</span></div><div class="reel" id="reel2"><span>🍋</span></div></div>
      <div id="slotMsg"></div></div>
  </section>
</div>
<script>
/* ---- physics.js ---- */
/* Gemily Lemon's Last Stand - deterministic physics + chain reaction core.
   No randomness in here: the hint solver replays shots with the exact same steps the live game uses. */
(function (root) {
  'use strict';
  const G = root.G = root.G || {};

  const W = 720, H = 1040, L = 46, T = 46, R = 674, B = 994, MIDY = 520;
  const POCKETS = [[L, T], [R, T], [L, B], [R, B], [L, MIDY], [R, MIDY]].map(p => ({ x: p[0], y: p[1] }));
  const CAP = 50;
  const DT = 1 / 120;
  const STOP = 14;
  G.TABLE = { W, H, L, T, R, B, MIDY, POCKETS, CAP };
  G.DT = DT;

  // blast = shockwave radius, pts = base score, m = mass, hp = hits to pop
  const FRUITS = {
    apple:     { r: 30, hp: 1, blast: 100, pts: 100, m: 1.0,  name: 'Apple' },
    orange:    { r: 31, hp: 1, blast: 108, pts: 120, m: 1.05, name: 'Orange' },
    cherry:    { r: 23, hp: 1, blast: 74,  pts: 140, m: 0.6,  pits: 3, name: 'Cherry' },
    banana:    { r: 27, hp: 1, blast: 66,  pts: 160, m: 0.9,  beam: 340, name: 'Banana' },
    chili:     { r: 26, hp: 1, blast: 128, pts: 180, m: 0.8,  hot: true, name: 'Chili' },
    pineapple: { r: 35, hp: 2, blast: 118, pts: 220, m: 1.4,  name: 'Pineapple' },
    blueberry: { r: 19, hp: 1, blast: 70,  pts: 80,  m: 0.4,  name: 'Blueberry' },
    melon:     { r: 42, hp: 2, blast: 150, pts: 300, m: 2.0,  pits: 5, name: 'Melon' },
    boss:      { r: 66, hp: 6, blast: 215, pts: 2000, m: 5.0, pits: 10, name: 'Big Melon' },
    lemon:     { r: 30, hp: 99, blast: 0, pts: 0, m: 1.6, name: 'Lemon' },
    pit:       { r: 9,  hp: 1, blast: 0, pts: 0, m: 0.15, name: 'Pit' }
  };
  for (const k in FRUITS) if (k !== 'pit' && k !== 'lemon') FRUITS[k].r = Math.round(FRUITS[k].r * 1.12);
  FRUITS.lemon.r = 34;
  G.FRUITS = FRUITS;

  const THR_LEMON = 95;    // impact speed for the lemon to pop a fruit
  const THR_FRUIT = 310;   // fruit-on-fruit impacts that pop
  const PHYS_FIELDS = ['id', 'type', 'x', 'y', 'vx', 'vy', 'r', 'm', 'hp', 'alive', 'fuse', 'fuseSrc', 'mega',
    'gold', 'ang', 'ang0', 'portalCd', 'life', 'depth', 'accel'];

  class World {
    constructor(level) {
      this.level = level;
      this.bodies = [];
      this.time = 0;
      this.nextId = 1;
      this.emit = true;
      this.events = [];
      this.score = 0;
      this.shots = 0;
      this.pops = 0;
      this.shotPops = 0;
      this.shotScore = 0;
      this.maxDepth = 0;
      this.cueRespawn = -1;
      this.scratches = 0;
      this.bumpHits = 0;
      this.bumpers = level.bumpers || [];
      this.blocks = level.blocks || [];
      this.portals = level.portals || [];
      this.zones = level.zones || [];
      this.vortex = level.vortex || [];
      this.dmgQ = [];
      for (const f of level.fruits) this.addFruit(f.type, f.x, f.y, f);
      this.cue = this.addBody('lemon', level.lemon.x, level.lemon.y);
    }

    addBody(type, x, y, extra) {
      const d = FRUITS[type];
      const b = {
        id: this.nextId++, type, x, y, vx: 0, vy: 0, r: d.r, m: d.m, hp: d.hp, alive: true,
        fuse: -1, fuseSrc: null, mega: false, gold: false, maxHp: d.hp, ang: 0, ang0: 0, portalCd: 0, life: 0, depth: 0, accel: 0
      };
      if (extra) Object.assign(b, extra);
      this.bodies.push(b);
      return b;
    }
    addFruit(type, x, y, f) {
      return this.addBody(type, x, y, { gold: !!(f && f.gold), ang0: (f && f.ang) || 0 });
    }
    fruits() { return this.bodies.filter(b => b.alive && b.type !== 'lemon' && b.type !== 'pit'); }
    fruitCount() {
      let n = 0;
      for (const b of this.bodies) if (b.alive && b.type !== 'lemon' && b.type !== 'pit') n++;
      return n;
    }
    ev(e) { if (this.emit) this.events.push(e); }

    shoot(angle, power) {
      const c = this.cue;
      const sp = 260 + 1500 * Math.max(0, Math.min(1, power));
      c.vx = Math.cos(angle) * sp; c.vy = Math.sin(angle) * sp;
      this.shots++; this.shotPops = 0; this.shotScore = 0; this.maxDepth = 0;
      this.ev({ t: 'shoot', power, x: c.x, y: c.y });
    }

    isSettled() {
      if (this.cueRespawn > 0) return false;
      for (const b of this.bodies) {
        if (!b.alive) continue;
        if (b.vx !== 0 || b.vy !== 0 || b.fuse >= 0 || b.type === 'pit') return false;
      }
      return this.dmgQ.length === 0;
    }

    damage(b, amt, src) {
      if (!b.alive || b.type === 'lemon' || b.type === 'pit') return;
      b.hp -= amt;
      if (src) b.depth = Math.max(b.depth, src.type === 'lemon' ? 0 : src.depth + 1);
      if (b.hp <= 0) this.detonate(b, false);
      else { b.fuse = -1; this.ev({ t: 'hurt', b }); }
    }

    prime(g, delay, src, push) {
      if (!g.alive || g.type === 'lemon' || g.type === 'pit') return;
      if (g.fuse < 0 || delay < g.fuse) {
        if (g.fuse < 0) this.ev({ t: 'prime', b: g });
        g.fuse = delay; g.fuseSrc = src;
      }
    }

    detonate(b, pocket) {
      if (!b.alive) return;
      b.alive = false; b.fuse = -1;
      const d = FRUITS[b.type];
      const depth = b.depth;
      this.pops++; this.shotPops++;
      if (depth > this.maxDepth) this.maxDepth = depth;
      let pts = d.pts * (1 + 0.35 * depth) * (1 + 0.15 * (this.shotPops - 1));
      if (pocket) pts *= 2;
      if (b.gold) pts *= 5;
      pts = Math.round(pts / 10) * 10;
      this.score += pts; this.shotScore += pts;
      this.ev({ t: 'boom', b, x: b.x, y: b.y, type: b.type, depth, pocket, gold: b.gold, pts, n: this.shotPops, blast: d.blast });

      // shockwave: push + light the fuse on everything inside the blast radius
      const blast = d.blast;
      for (const g of this.bodies) {
        if (!g.alive || g === b || g.type === 'pit') continue;
        const dx = g.x - b.x, dy = g.y - b.y;
        const dist = Math.sqrt(dx * dx + dy * dy) || 0.001;
        if (dist > blast) continue;
        const k = 1 - Math.min(1, dist / (blast + g.r));
        const strength = (d.hot ? 470 : 320) * (b.type === 'boss' ? 1.4 : 1);
        const f = (g.type === 'lemon' ? 0.45 : 1) * strength * k / Math.sqrt(g.m);
        g.vx += dx / dist * f; g.vy += dy / dist * f;
        if (g.type !== 'lemon') {
          const delay = (d.hot ? 0.06 : 0.1) + 0.16 * (dist / blast);
          g.depth = Math.max(g.depth, depth + 1);
          this.prime(g, delay, b);
        }
      }
      if (d.beam) {
        const dirx = Math.cos(b.ang0), diry = Math.sin(b.ang0);
        this.ev({ t: 'beam', x: b.x, y: b.y, ang: b.ang0, len: d.beam });
        for (const g of this.bodies) {
          if (!g.alive || g === b || g.type === 'lemon' || g.type === 'pit') continue;
          const dx = g.x - b.x, dy = g.y - b.y;
          const along = dx * dirx + dy * diry;
          const perp = Math.abs(dx * diry - dy * dirx);
          if (Math.abs(along) < d.beam && perp < 26 + g.r) {
            g.depth = Math.max(g.depth, depth + 1);
            this.prime(g, 0.07 + Math.abs(along) * 0.0004, b);
            const s = along >= 0 ? 1 : -1;
            g.vx += dirx * s * 260 / Math.sqrt(g.m); g.vy += diry * s * 260 / Math.sqrt(g.m);
          }
        }
      }
      if (d.pits) {
        const n = d.pits;
        for (let i = 0; i < n; i++) {
          const a = b.ang0 + 0.5 + i * Math.PI * 2 / n;
          const sp = b.type === 'boss' ? 620 : 520;
          this.addBody('pit', b.x + Math.cos(a) * (b.r * 0.6), b.y + Math.sin(a) * (b.r * 0.6),
            { vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.62, depth: depth });
        }
      }
    }

    popCue() {
      const c = this.cue;
      c.alive = false; c.vx = c.vy = 0;
      this.cueRespawn = 0.7;
      this.scratches++;
      this.ev({ t: 'scratch', x: c.x, y: c.y });
    }
    respawnCue() {
      const c = this.cue, s = this.level.lemon;
      let x = s.x, y = s.y;
      for (let tries = 0; tries < 40; tries++) {
        let ok = true;
        for (const b of this.bodies) {
          if (!b.alive || b === c || b.type === 'pit') continue;
          if (Math.hypot(b.x - x, b.y - y) < b.r + c.r + 6) { ok = false; break; }
        }
        if (ok) break;
        x = s.x + ((tries % 2) ? 1 : -1) * (70 + tries * 14);
        y = s.y - (tries % 3) * 30;
        x = Math.max(L + 40, Math.min(R - 40, x));
      }
      c.x = x; c.y = y; c.vx = c.vy = 0; c.alive = true;
      this.ev({ t: 'respawn', x, y });
    }

    // Mega Squeeze: the rescue move that makes every level winnable
    megaSqueeze() {
      const list = this.fruits().sort((a, b) => Math.hypot(a.x - this.cue.x, a.y - this.cue.y) - Math.hypot(b.x - this.cue.x, b.y - this.cue.y));
      this.shots++; this.shotPops = 0; this.shotScore = 0; this.maxDepth = 0;
      list.forEach((g, i) => { g.mega = true; g.fuse = 0.25 + i * 0.13; g.depth = i; });
      this.ev({ t: 'mega' });
    }
    zestBomb(g) {
      this.shots++; this.shotPops = 0; this.shotScore = 0; this.maxDepth = 0;
      g.hp = 0; g.depth = 0;
      this.ev({ t: 'zest', b: g });
      this.detonate(g, false);
    }

    step() {
      const dt = DT;
      this.time += dt;
      const bs = this.bodies;
      let n = bs.length;
      if (this.cueRespawn > 0) { this.cueRespawn -= dt; if (this.cueRespawn <= 0) { this.cueRespawn = -1; this.respawnCue(); } }

      for (let i = 0; i < n; i++) {
        const b = bs[i];
        if (b.alive && b.fuse >= 0) {
          b.fuse -= dt;
          if (b.fuse <= 0) { b.fuse = -1; this.damage(b, b.mega ? 99 : 1, b.fuseSrc); }
        }
      }
      n = bs.length;

      // integrate
      for (let i = 0; i < n; i++) {
        const b = bs[i];
        if (!b.alive) continue;
        let ax = 0, ay = 0;
        for (const v of this.vortex) {
          const dx = v.x - b.x, dy = v.y - b.y, d = Math.hypot(dx, dy);
          if (d < v.r && d > 1) {
            const k = (1 - d / v.r) * Math.min(1, d / 40) * v.s;
            ax += dx / d * k - dy / d * k * 0.55; ay += dy / d * k + dx / d * k * 0.55;
          }
        }
        let kf = 1.0, cf = 140;
        if (b.type === 'pit') { kf = 0.15; cf = 0; }
        else for (const z of this.zones) {
          if (b.x > z.x - z.w / 2 && b.x < z.x + z.w / 2 && b.y > z.y - z.h / 2 && b.y < z.y + z.h / 2) { kf = z.k; cf = z.c; }
        }
        b.vx += ax * dt; b.vy += ay * dt;
        b.accel = Math.hypot(ax, ay);
        let sp = Math.hypot(b.vx, b.vy);
        if (sp > 0) {
          const ns = Math.max(0, sp - (kf * sp + cf) * dt);
          const s = ns / sp; b.vx *= s; b.vy *= s; sp = ns;
          if (sp < STOP && b.accel < cf) { b.vx = 0; b.vy = 0; sp = 0; }
        } else if (b.accel > cf) { /* pushed out of rest by a vortex */ }
        b.x += b.vx * dt; b.y += b.vy * dt;
        if (b.type !== 'banana') b.ang += (b.vx * 0.5 + b.vy * 0.2) * dt / b.r;
        if (b.portalCd > 0) b.portalCd -= dt;
        if (b.type === 'pit') { b.life -= dt; if (b.life <= 0) { b.alive = false; } }
      }

      // portals
      if (this.portals.length) {
        for (let i = 0; i < n; i++) {
          const b = bs[i];
          if (!b.alive || b.portalCd > 0 || b.type === 'pit') continue;
          for (const p of this.portals) {
            const da = Math.hypot(b.x - p.a.x, b.y - p.a.y), db = Math.hypot(b.x - p.b.x, b.y - p.b.y);
            let from = null, to = null;
            if (da < 26) { from = p.a; to = p.b; } else if (db < 26) { from = p.b; to = p.a; }
            if (from) {
              const sp = Math.hypot(b.vx, b.vy) || 1;
              b.x = to.x + b.vx / sp * 34; b.y = to.y + b.vy / sp * 34;
              b.portalCd = 0.5;
              this.ev({ t: 'portal', fx: from.x, fy: from.y, tx: to.x, ty: to.y, b });
              break;
            }
          }
        }
      }

      // walls
      for (let i = 0; i < n; i++) {
        const b = bs[i];
        if (!b.alive) continue;
        const e = b.type === 'pit' ? 1 : 0.88, r = b.r;
        let hit = 0;
        if (b.x < L + r) { b.x = L + r; if (b.vx < 0) { hit = -b.vx; b.vx = -b.vx * e; } }
        else if (b.x > R - r) { b.x = R - r; if (b.vx > 0) { hit = b.vx; b.vx = -b.vx * e; } }
        if (b.y < T + r) { b.y = T + r; if (b.vy < 0) { hit = Math.max(hit, -b.vy); b.vy = -b.vy * e; } }
        else if (b.y > B - r) { b.y = B - r; if (b.vy > 0) { hit = Math.max(hit, b.vy); b.vy = -b.vy * e; } }
        if (hit > 90 && b.type !== 'pit') this.ev({ t: 'wall', x: b.x, y: b.y, speed: hit, b });
      }

      // bumpers + blocks
      for (let i = 0; i < n; i++) {
        const b = bs[i];
        if (!b.alive || b.type === 'pit') continue;
        for (const bp of this.bumpers) {
          const dx = b.x - bp.x, dy = b.y - bp.y, rr = b.r + bp.r, d2 = dx * dx + dy * dy;
          if (d2 < rr * rr && d2 > 0) {
            const d = Math.sqrt(d2), nx = dx / d, ny = dy / d;
            b.x = bp.x + nx * rr; b.y = bp.y + ny * rr;
            const vn = b.vx * nx + b.vy * ny;
            if (vn < 0) { b.vx -= 2 * vn * nx; b.vy -= 2 * vn * ny; }
            b.vx += nx * 230; b.vy += ny * 230;
            this.bumpHits++;
            this.ev({ t: 'bump', x: bp.x, y: bp.y, bp, b });
          }
        }
        for (const bl of this.blocks) {
          const x0 = bl.x - bl.w / 2, x1 = bl.x + bl.w / 2, y0 = bl.y - bl.h / 2, y1 = bl.y + bl.h / 2;
          const cx = Math.max(x0, Math.min(x1, b.x)), cy = Math.max(y0, Math.min(y1, b.y));
          let dx = b.x - cx, dy = b.y - cy;
          const d2 = dx * dx + dy * dy;
          if (d2 < b.r * b.r) {
            let nx, ny;
            if (d2 > 0.0001) { const d = Math.sqrt(d2); nx = dx / d; ny = dy / d; b.x = cx + nx * b.r; b.y = cy + ny * b.r; }
            else {
              const pl = b.x - x0, pr = x1 - b.x, pt = b.y - y0, pb = y1 - b.y, m = Math.min(pl, pr, pt, pb);
              if (m === pl) { nx = -1; ny = 0; b.x = x0 - b.r; } else if (m === pr) { nx = 1; ny = 0; b.x = x1 + b.r; }
              else if (m === pt) { nx = 0; ny = -1; b.y = y0 - b.r; } else { nx = 0; ny = 1; b.y = y1 + b.r; }
            }
            const vn = b.vx * nx + b.vy * ny;
            if (vn < 0) {
              b.vx -= 1.9 * vn * nx; b.vy -= 1.9 * vn * ny;
              if (-vn > 90) this.ev({ t: 'wall', x: b.x, y: b.y, speed: -vn, b });
            }
          }
        }
      }

      // body vs body
      const q = this.dmgQ;
      for (let i = 0; i < n; i++) {
        const a = bs[i];
        if (!a.alive) continue;
        for (let j = i + 1; j < n; j++) {
          const b = bs[j];
          if (!b.alive) continue;
          const at = a.type, bt = b.type;
          if (at === 'pit' && (bt === 'pit' || bt === 'lemon')) continue;
          if (bt === 'pit' && at === 'lemon') continue;
          const dx = b.x - a.x, dy = b.y - a.y, rr = a.r + b.r;
          if (dx > rr || dx < -rr || dy > rr || dy < -rr) continue;
          const d2 = dx * dx + dy * dy;
          if (d2 >= rr * rr || d2 === 0) continue;
          const d = Math.sqrt(d2), nx = dx / d, ny = dy / d;
          const ov = rr - d, tot = a.m + b.m;
          a.x -= nx * ov * b.m / tot; a.y -= ny * ov * b.m / tot;
          b.x += nx * ov * a.m / tot; b.y += ny * ov * a.m / tot;
          const rvn = (a.vx - b.vx) * nx + (a.vy - b.vy) * ny;
          if (rvn > 0) {
            if (at === 'pit' || bt === 'pit') {
              const pit = at === 'pit' ? a : b, fr = at === 'pit' ? b : a;
              if (rvn > 40) { q.push([fr, 1, pit]); pit.alive = false; fr.vx += pit.vx * 0.12; fr.vy += pit.vy * 0.12; this.ev({ t: 'pitpop', x: pit.x, y: pit.y }); }
              continue;
            }
            const e = 0.9, imp = (1 + e) * rvn / (1 / a.m + 1 / b.m);
            a.vx -= imp * nx / a.m; a.vy -= imp * ny / a.m;
            b.vx += imp * nx / b.m; b.vy += imp * ny / b.m;
            if (rvn > 30) this.ev({ t: 'hit', x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, speed: rvn, a, b, nx, ny });
            if (at === 'lemon' || bt === 'lemon') {
              const fr = at === 'lemon' ? b : a, lm = at === 'lemon' ? a : b;
              if (rvn >= THR_LEMON) q.push([fr, 1, lm]);
            } else if (rvn >= THR_FRUIT) {
              q.push([a, 1, b]); q.push([b, 1, a]);
            }
          }
        }
      }
      if (q.length) {
        for (let k = 0; k < q.length; k++) this.damage(q[k][0], q[k][1], q[k][2]);
        q.length = 0;
      }

      // pockets (with a gentle funnel pull so slow fruit drops in)
      for (let i = 0; i < bs.length; i++) {
        const b = bs[i];
        if (!b.alive) continue;
        for (const p of POCKETS) {
          const dx = p.x - b.x, dy = p.y - b.y, d = Math.hypot(dx, dy);
          if (d < CAP) {
            if (b.type === 'lemon') this.popCue();
            else if (b.type === 'pit') b.alive = false;
            else { this.ev({ t: 'pocket', b, x: p.x, y: p.y }); b.x = p.x; b.y = p.y; this.detonate(b, true); }
            break;
          } else if (d < CAP + 46 && b.type !== 'pit' && b.type !== 'lemon') {
            const sp = Math.hypot(b.vx, b.vy);
            if (sp < 240) { b.vx += dx / d * 1500 * dt; b.vy += dy / d * 1500 * dt; }
          }
        }
      }

      // compact
      let w = 0;
      for (let i = 0; i < bs.length; i++) { const b = bs[i]; if (b.alive || b === this.cue) bs[w++] = b; }
      bs.length = w;
    }

    clone() {
      const w = Object.create(World.prototype);
      w.level = this.level; w.time = this.time; w.nextId = this.nextId; w.emit = false; w.events = [];
      w.score = this.score; w.shots = this.shots; w.pops = this.pops; w.shotPops = this.shotPops; w.shotScore = this.shotScore;
      w.maxDepth = this.maxDepth; w.cueRespawn = this.cueRespawn; w.scratches = this.scratches; w.bumpHits = this.bumpHits;
      w.bumpers = this.bumpers; w.blocks = this.blocks; w.portals = this.portals; w.zones = this.zones; w.vortex = this.vortex;
      w.dmgQ = [];
      w.bodies = this.bodies.map(b => {
        const c = {};
        for (const k of PHYS_FIELDS) c[k] = b[k];
        return c;
      });
      w.cue = w.bodies.find(b => b.type === 'lemon');
      return w;
    }
  }
  G.World = World;

  // aim preview: where would the lemon first touch something, with up to 2 wall bounces

  // ------------------------------------------------------------ input
  const DEAD = 22, MAXPULL = 230;
  function toLogical(e) { const r = stage.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
  stage.addEventListener('pointerdown', e => {
    A.init(); A.resume();
    if (!world || paused) return;
    const p = toLogical(e);
    if (phase === 'roll') { fast = true; return; }
    if (phase !== 'aim') return;
    if (zestMode) {
      let best = null, bd = 1e9;
      for (const f of world.fruits()) { const d = Math.hypot(f.x - p.x, f.y - p.y); if (d < f.r + 40 && d < bd) { bd = d; best = f; } }
      if (best) doZest(best);

    aim = { sx: p.x, sy: p.y, cx: p.x, cy: p.y, active: true, len: 0, ang: -Math.PI / 2, pow: 0, id: e.pointerId, lastTick: 0 };
    try { stage.setPointerCapture(e.pointerId); } catch (er) { /* ignore */ }
    e.preventDefault();
  });

    const p = toLogical(e); aim.cx = p.x; aim.cy = p.y;
    const dx = aim.sx - aim.cx, dy = aim.sy - aim.cy; aim.len = Math.hypot(dx, dy); aim.ang = Math.atan2(dy, dx);
    aim.pow = clamp((aim.len - DEAD) / MAXPULL, 0, 1);

  });

    const a = aim; aim = null; a.active = false;

  function togglePause() {
    if (phase === 'title' || phase === 'boot') return;
    paused = !paused;
    if (paused) { show('sPause'); } else { $('sPause').classList.remove('open'); $('sPause').hidden = true; document.body.classList.remove('overlay'); }
    A.ui();
  }
  function syncSnd() {
    $('btnSnd').textContent = (A.musicOn || A.sfxOn) ? '🔊' : '🔇';
    $('tgMusic').textContent = 'Music: ' + (A.musicOn ? 'ON' : 'OFF'); $('tgSfx').textContent = 'Sound FX: ' + (A.sfxOn ? 'ON' : 'OFF');
  }

  function wireUI() {
    $('btnContinue').onclick = () => { A.init(); A.resume(); A.ui(); if (!Save.d.seen) story(); else startLevel(Save.d.unlocked); };
    $('btnLevels').onclick = () => { A.init(); A.resume(); A.ui(); buildLevels(); show('sLevels'); };
    $('lvBack').onclick = () => { A.back(); if (world && phase !== 'title' && phase !== 'boot') { hideAll(); } else openTitle(); };
    $('btnPause').onclick = () => { A.init(); togglePause(); };
    $('btnResume').onclick = () => togglePause();
    $('btnRestart').onclick = () => { paused = false; A.ui(); startLevel(n); };
    $('btnPLevels').onclick = () => { paused = false; A.ui(); buildLevels(); show('sLevels'); };
    $('btnPHome').onclick = () => { paused = false; A.back(); openTitle(); };
    $('btnSnd').onclick = () => { A.init(); const on = !(A.musicOn || A.sfxOn); A.setMusic(on); A.setSfx(on); A.musicOn = A.sfxOn = on; Save.d.music = Save.d.sfx = on; Save.save(); syncSnd(); A.ui(); };
    $('tgMusic').onclick = () => { A.init(); A.musicOn = !A.musicOn; A.setMusic(A.musicOn); Save.d.music = A.musicOn; Save.save(); syncSnd(); A.ui(); };
    $('tgSfx').onclick = () => { A.init(); A.sfxOn = !A.sfxOn; A.setSfx(A.sfxOn); Save.d.sfx = A.sfxOn; Save.save(); syncSnd(); A.ui(); };
    $('btnHint').onclick = doHint;
    $('btnZest').onclick = () => { if (phase !== 'aim' || zest <= 0) return; zestMode = !zestMode; A.ui(); if (zestMode) Gem.say(G.LINES.zest, { mood: 'talk', hold: 2200 }); updateHud(); };
    $('btnMega').onclick = doMega;
    $('clNext').onclick = () => { A.ui(); startLevel(n + 1); };
    $('clReplay').onclick = () => { A.ui(); startLevel(n); };
    $('clMenu').onclick = () => { A.back(); buildLevels(); show('sLevels'); };
    $('sSlot').addEventListener('pointerdown', () => { /* tap to fast-forward is handled by timers; just swallow */ });
    document.addEventListener('visibilitychange', () => { if (!A.ctx) return; if (document.hidden) A.ctx.suspend(); else A.ctx.resume(); });
    window.addEventListener('resize', layout); window.addEventListener('orientationchange', () => setTimeout(layout, 200));
    // first gesture anywhere unlocks audio
    const unlock = () => { A.init(); A.resume(); if (A.ctx && !A.playing) A.play(0, 'menu'); window.removeEventListener('pointerdown', unlock); };
    window.addEventListener('pointerdown', unlock);
  }

  // ------------------------------------------------------------ rendering
  function drawGadgets() {
    const wt = WT();
    for (const z of world.vortex) {
      sctx.save(); sctx.translate(z.x, z.y);
      const g = sctx.createRadialGradient(0, 0, 4, 0, 0, z.r); g.addColorStop(0, 'rgba(20,0,40,.75)'); g.addColorStop(0.5, 'rgba(120,60,255,.28)'); g.addColorStop(1, 'rgba(120,60,255,0)');
      sctx.fillStyle = g; sctx.beginPath(); sctx.arc(0, 0, z.r, 0, TAU); sctx.fill();
      sctx.rotate(time * 1.6); sctx.strokeStyle = 'rgba(210,190,255,.8)'; sctx.lineWidth = 4; sctx.lineCap = 'round';
      for (let k = 0; k < 3; k++) { sctx.rotate(TAU / 3); sctx.beginPath(); for (let t = 0; t < 1; t += 0.05) { const a = t * 3.2, rr = 12 + t * 120; sctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } sctx.stroke(); }
      sctx.restore();
    }
    for (const p of world.portals) {
      [p.a, p.b].forEach((q, i) => {
        sctx.save(); sctx.translate(q.x, q.y);
        const col = i ? '#7fe9ff' : '#c79bff';
        const g = sctx.createRadialGradient(0, 0, 2, 0, 0, 34); g.addColorStop(0, '#05010c'); g.addColorStop(0.7, i ? '#0b2f55' : '#2c0b55'); g.addColorStop(1, col);
        sctx.fillStyle = g; sctx.beginPath(); sctx.arc(0, 0, 32, 0, TAU); sctx.fill();
        sctx.strokeStyle = col; sctx.lineWidth = 5; sctx.setLineDash([14, 9]); sctx.lineDashOffset = -time * 40 * (i ? -1 : 1); sctx.beginPath(); sctx.arc(0, 0, 38, 0, TAU); sctx.stroke(); sctx.setLineDash([]);
        sctx.strokeStyle = '#fff'; sctx.lineWidth = 2; sctx.beginPath(); sctx.arc(0, 0, 25 + Math.sin(time * 4 + i) * 3, 0, TAU); sctx.stroke();
        sctx.restore();
      });
    }
    for (const b of world.bumpers) {
      const pl = b.pulse || 0, rr = b.r + pl * 8;
      sctx.save(); sctx.translate(b.x, b.y);
      sctx.fillStyle = 'rgba(0,0,0,.28)'; sctx.beginPath(); sctx.ellipse(3, 8, rr + 4, rr * 0.7, 0, 0, TAU); sctx.fill();
      const g = sctx.createRadialGradient(-rr * 0.3, -rr * 0.3, 2, 0, 0, rr); g.addColorStop(0, '#fff7c0'); g.addColorStop(0.5, wt.rim[0]); g.addColorStop(1, wt.rim[1]);
      sctx.fillStyle = g; sctx.beginPath(); sctx.arc(0, 0, rr, 0, TAU); sctx.fill(); sctx.lineWidth = 4; sctx.strokeStyle = INK; sctx.stroke();
      sctx.fillStyle = pl > 0.2 ? '#fff' : wt.rimEdge; Art.star(sctx, 0, 0, rr * 0.5, pl > 0.2 ? '#fff' : '#ffffff');
      sctx.strokeStyle = 'rgba(255,255,255,' + (0.4 + pl * 0.6) + ')'; sctx.lineWidth = 3; sctx.beginPath(); sctx.arc(0, 0, rr + 7 + pl * 6, 0, TAU); sctx.stroke();
      sctx.restore();
    }
  }

  function segDist(px, py, ax, ay, bx, by) {
    const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy || 1;
    const t = clamp(((px - ax) * dx + (py - ay) * dy) / l2, 0, 1);
    return Math.hypot(px - (ax + dx * t), py - (ay + dy * t));
  }
  function worryAlong(pv) {
    for (const f of world.fruits()) {
      let near = f === pv.hit;
      if (!near) for (let i = 0; i < pv.pts.length - 1; i++) { if (segDist(f.x, f.y, pv.pts[i].x, pv.pts[i].y, pv.pts[i + 1].x, pv.pts[i + 1].y) < f.r + 26) { near = true; break; } }
      if (near) { const v = vis(f); if (v.mood === 'idle') { v.mood = 'worry'; v.moodT = 0.15; } }
    }
  }
  function drawGuide(pv, col, width, dashed, pulse) {
    sctx.save(); sctx.lineCap = 'round'; sctx.lineJoin = 'round';
    sctx.strokeStyle = col; sctx.lineWidth = width; sctx.setLineDash(dashed ? [3, 16] : []); sctx.lineDashOffset = -time * 34;
    sctx.beginPath(); pv.pts.forEach((p, i) => i ? sctx.lineTo(p.x, p.y) : sctx.moveTo(p.x, p.y)); sctx.stroke();
    sctx.setLineDash([]);
    if (pv.hit) {
      sctx.globalAlpha = 0.55; sctx.fillStyle = col; sctx.beginPath(); sctx.arc(pv.x, pv.y, world.cue.r, 0, TAU); sctx.fill();
      sctx.globalAlpha = 1; sctx.lineWidth = 4; sctx.strokeStyle = col; sctx.beginPath(); sctx.arc(pv.hit.x, pv.hit.y, pv.hit.r + 8 + (pulse ? Math.sin(time * 8) * 3 : 0), 0, TAU); sctx.stroke();
    }
    sctx.restore();
  }
  function drawAim() {
    const c = world.cue;
    if (aim && aim.active && phase === 'aim' && aim.len > DEAD) {
      const dir = { x: Math.cos(aim.ang), y: Math.sin(aim.ang) };
      const pv = G.rayPreview(world, dir.x, dir.y); worryAlong(pv);
      drawGuide(pv, 'rgba(255,255,255,.95)', 7, true, true);
      // slingshot band toward the pull
      const pull = Math.min(aim.len, MAXPULL + DEAD);
      const ex = c.x - dir.x * pull * 0.8, ey = c.y - dir.y * pull * 0.8;
      const hue = 120 - aim.pow * 120;
      sctx.save(); sctx.lineCap = 'round';
      sctx.strokeStyle = 'rgba(0,0,0,.25)'; sctx.lineWidth = 16; sctx.beginPath(); sctx.moveTo(c.x + 3, c.y + 4); sctx.lineTo(ex + 3, ey + 4); sctx.stroke();
      sctx.strokeStyle = `hsl(${hue},95%,60%)`; sctx.lineWidth = 12; sctx.beginPath(); sctx.moveTo(c.x, c.y); sctx.lineTo(ex, ey); sctx.stroke();
      sctx.strokeStyle = 'rgba(255,255,255,.7)'; sctx.lineWidth = 4; sctx.beginPath(); sctx.moveTo(c.x, c.y); sctx.lineTo(ex, ey); sctx.stroke();
      sctx.fillStyle = `hsl(${hue},95%,60%)`; sctx.strokeStyle = INK; sctx.lineWidth = 4; sctx.beginPath(); sctx.arc(ex, ey, 15, 0, TAU); sctx.fill(); sctx.stroke();
      sctx.lineWidth = 8; sctx.strokeStyle = `hsl(${hue},95%,60%)`; sctx.beginPath(); sctx.arc(c.x, c.y, c.r + 14, -Math.PI / 2, -Math.PI / 2 + TAU * Math.max(0.03, aim.pow)); sctx.stroke();
      sctx.restore();
    } else if (hint && phase === 'aim') {
      const pv = G.rayPreview(world, Math.cos(hint.angle), Math.sin(hint.angle));
      drawGuide(pv, '#ffe35a', 8, true, true);
      sctx.save(); sctx.font = '900 30px "Trebuchet MS",Verdana,sans-serif'; sctx.textAlign = 'center'; sctx.lineWidth = 8; sctx.strokeStyle = INK; sctx.lineJoin = 'round';
      const tx = clamp(c.x + Math.cos(hint.angle) * 120, 90, W - 90), ty = clamp(c.y + Math.sin(hint.angle) * 120, 90, H - 90);
      const label = hint.left === 0 ? 'CLEARS THE TABLE!' : '~' + hint.pops + ' POPS';
      sctx.strokeText(label, tx, ty); sctx.fillStyle = '#ffe35a'; sctx.fillText(label, tx, ty);
      sctx.fillStyle = '#fff'; sctx.font = '700 20px "Trebuchet MS",Verdana,sans-serif'; sctx.strokeText('pull back opposite', tx, ty + 28); sctx.fillText('pull back opposite', tx, ty + 28);
      sctx.restore();
    }
    if (solver) {  // "thinking" shimmer around the lemon
      sctx.save(); sctx.strokeStyle = '#ffe35a'; sctx.lineWidth = 5; sctx.setLineDash([10, 10]); sctx.lineDashOffset = -time * 80;
      sctx.beginPath(); sctx.arc(c.x, c.y, c.r + 22, 0, TAU); sctx.stroke(); sctx.restore();
    }
  }

  function drawBody(b) {
    const v = vis(b), d = G.FRUITS[b.type];
    sctx.save(); sctx.translate(b.x, b.y);
    const primed = b.fuse >= 0;
    if (primed) sctx.translate(Math.sin(time * 90 + b.id) * 2.2, Math.cos(time * 77 + b.id) * 1.8);
    if (b.gold) Art.goldAura(sctx, b.r, time + b.id);
    const br = 1 + 0.022 * Math.sin(time * 2.4 + v.phase);
    let sx = br, sy = 2 - br;
    if (primed) { const pu = 1 + 0.06 * Math.sin(time * 40); sx *= pu; sy *= pu; }
    sctx.scale(sx, sy);
    if (v.squash > 0.01) { sctx.rotate(v.sa); sctx.scale(1 - v.squash, 1 + v.squash * 0.7); sctx.rotate(-v.sa); }
    const sp = Math.hypot(b.vx, b.vy);
    if (sp > 220) { const a = Math.atan2(b.vy, b.vx), st = Math.min(0.2, sp / 8000); sctx.rotate(a); sctx.scale(1 + st, 1 - st * 0.7); sctx.rotate(-a); }
    Art.body(sctx, b.type, b.r, b);
    if (primed) {   // angry red pulse overlay + fuse sparkle
      sctx.globalAlpha = 0.35 + 0.25 * Math.sin(time * 36); sctx.fillStyle = '#ff2b2b'; sctx.beginPath(); sctx.arc(0, 0, b.r * 1.02, 0, TAU); sctx.fill(); sctx.globalAlpha = 1;
      Art.star(sctx, Math.sin(time * 30) * 4, -b.r * 1.15, 8 + Math.sin(time * 50) * 3, '#fff3a0');
    }
    if (b.type === 'banana' && !primed) { // faint beam hint
      sctx.save(); sctx.rotate(b.ang0); sctx.strokeStyle = 'rgba(255,245,150,.35)'; sctx.lineWidth = 5; sctx.setLineDash([4, 14]); sctx.lineDashOffset = -time * 20;
      sctx.beginPath(); sctx.moveTo(-d.beam, 0); sctx.lineTo(d.beam, 0); sctx.stroke(); sctx.restore();
    }
    const fv = { look: v.look, mood: v.mood, blink: v.blink, t: v.t, moodT: v.moodT, smirk: v.smirk };
    if (b.type !== 'pit') Art.face(sctx, b.r, fv, b.type);
    sctx.restore();
    if (b.type === 'boss' || (b.type === 'melon' && b.hp < 2) || (b.type === 'pineapple' && b.hp < 2)) {
      if (b.type === 'boss') {
        const w = 120, x0 = b.x - w / 2, y0 = b.y - b.r - 44;
        sctx.fillStyle = INK; sctx.fillRect(x0 - 3, y0 - 3, w + 6, 16); sctx.fillStyle = '#ff3d7a'; sctx.fillRect(x0, y0, w * clamp(b.hp / b.maxHp, 0, 1), 10);
        sctx.fillStyle = 'rgba(255,255,255,.4)'; sctx.fillRect(x0, y0, w * clamp(b.hp / b.maxHp, 0, 1), 3);
      }
    }
  }

  function drawLemonTrail() {
    const c = world.cue;
    if (!c.alive) { trail.length = 0; return; }
    const sp = Math.hypot(c.vx, c.vy);
    if (sp > 260) { trail.push({ x: c.x, y: c.y, a: 1 }); if (trail.length > 12) trail.shift(); } else if (trail.length) trail.shift();
    for (let i = 0; i < trail.length; i++) {
      const t = trail[i], k = (i + 1) / trail.length;
      sctx.globalAlpha = 0.28 * k; sctx.fillStyle = '#fff17a'; sctx.beginPath(); sctx.arc(t.x, t.y, c.r * (0.45 + 0.5 * k), 0, TAU); sctx.fill();
    }
    sctx.globalAlpha = 1;
  }

  function render() {
    const sh = FX.shake, ox = sh ? (Math.random() - 0.5) * sh * 1.7 : 0, oy = sh ? (Math.random() - 0.5) * sh * 1.7 : 0;
    sctx.setTransform(pxs, 0, 0, pxs, 0, 0);
    sctx.fillStyle = WT().bg[0]; sctx.fillRect(0, 0, W, H);
    sctx.save(); sctx.translate(ox, oy);
    if (sh > 12) { const z = 1 + sh * 0.0016; sctx.translate(W / 2, H / 2); sctx.scale(z, z); sctx.translate(-W / 2, -H / 2); }
    sctx.drawImage(tableCv, 0, 0, W, H);
    FX.drawLow(sctx);
    if (world) {
      drawGadgets();
      drawAim();
      drawLemonTrail();
      for (const b of world.bodies) if (b.alive) { sctx.fillStyle = 'rgba(0,0,0,.26)'; sctx.beginPath(); sctx.ellipse(b.x + 3, b.y + b.r * 0.32, b.r * 0.95, b.r * 0.62, 0, 0, TAU); sctx.fill(); }
      const ordered = world.bodies.filter(b => b.alive).sort((a, b) => a.y - b.y);
      for (const b of ordered) drawBody(b);
    }
    FX.draw(sctx);
    sctx.restore();
    // post-process
    const rip = FX.ripples.map(r => ({ x: r.x, y: r.y, r: r.age * 0.7, s: Math.min(0.8, r.s) * Math.max(0, 1 - r.age / 0.9) }));
    const params = { time, aberr: FX.aberr + FX.shake * 0.00022, sat: 0.1 + Math.min(0.3, chainN * 0.03) + rainbow * 0.1, rainbow: Math.min(1, rainbow), flash: FX.flash * 0.35, ripples: rip, vig: 0.55 };
    if (useGL && G.GL.ok) {
      try { G.GL.render(scene, params); } catch (er) { useGL = false; console.warn(er); }
    } else if (dctx) dctx.drawImage(scene, 0, 0);
  }

  // ------------------------------------------------------------ main loop
  let last = performance.now();
  function frame(ts) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, (ts - last) / 1000); last = ts;
    if (paused || document.hidden) return;
    time += dt;
    if (rainbow > 0) rainbow = Math.max(0, rainbow - dt * 0.6);
    if (levelFlash > 0) levelFlash -= dt;
    if (world) {
      if (FX.hitstop > 0) FX.hitstop -= dt;
      else {
        let ts2 = fast ? 2.4 : 1;
        if (FX.slow > 0) { ts2 *= 0.3; FX.slow -= dt; }
        acc += dt * ts2; let steps = 0;
        while (acc >= G.DT && steps < 14) { world.step(); acc -= G.DT; steps++; if (world.events.length) handleEvents(); }
        if (steps >= 14) acc = 0;
      }
      if (phase === 'roll') {
        rollT += dt;
        if (rollT > 14) { for (const b of world.bodies) { b.vx = b.vy = 0; b.fuse = -1; } }
        if (rollT > 0.3 && world.isSettled()) { fast = false; resolveShot(); }
      }
      if (solver) { solver.run(7); if (solver.done) { hint = solver.best; solver = null; updateHud(); } }
      if (phase === 'title') {   // attract mode: the lemon plays itself
        const at = attract; at.t -= dt;
        if (at.stage === 'wait' && at.t <= 0) { solver = G.makeSolver(world); at.stage = 'think'; }
        else if (at.stage === 'think' && hint) { world.shoot(hint.angle, hint.power); hint = null; at.stage = 'roll'; rollT = 0; }
        else if (at.stage === 'roll') { rollT += dt; if ((rollT > 0.5 && world.isSettled()) || rollT > 9) { at.stage = 'rest'; at.t = 1.7; A.setIntensity(1); } }
        else if (at.stage === 'rest' && at.t <= 0) { if (world.fruitCount() > 0 && world.shots < 3) { at.stage = 'wait'; at.t = 0.3; } else startAttract(); }
      }
      FX.update(dt);
      updateFaces(dt);
      if (chainShow > 0) { chainShow -= dt; }
      if (frameCount++ % 6 === 0) updateHud();
      const cb = $('combo');
      if (chainN >= 3 && phase === 'roll') { cb.textContent = 'x' + chainN; cb.classList.add('on'); } else cb.classList.remove('on');
    } else FX.update(dt);
    render();
  }
  let frameCount = 0;

  // ------------------------------------------------------------ boot
  function boot() {
    Gem.make($('gemBox'), 'hud'); Gem.make($('titleGem'), 'big'); Gem.make($('clearGem'), 'big'); Gem.make($('storyGemSlot'), 'big');
    Gem.attach($('bubble'), $('bubbleText'));
    wireUI(); syncSnd();
    layout();
    openTitle();
    requestAnimationFrame(frame);
    // tiny debug/test hook
    window.__game = { get world() { return world; }, get phase() { return phase; }, startLevel, shoot, doZest, doMega, doHint, get par() { return par; }, FX, Save, setPaused(p) { paused = p; } };
  }
  window.addEventListener('load', () => { boot(); });
  // keep bubble docked whenever a level starts
  const obs = new MutationObserver(() => { if (document.body.dataset.phase === 'aim' && $('bubble').parentElement.id !== 'bubbleCol') dockBubble(); });
  obs.observe(document.body, { attributes: true, attributeFilter: ['data-phase'] });
})();

</script>
</body>
